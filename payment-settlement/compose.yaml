services:
  db:
    image: postgres:16
    cpus: 1.5
    mem_limit: 2048m
    shm_size: 512m
    environment:
      POSTGRES_DB: payment
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab-local-only
    command: ["postgres", "-c", "max_connections=40", "-c", "shared_buffers=512MB", "-c", "work_mem=4MB", "-c", "fsync=on", "-c", "synchronous_commit=on"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/001-seed.sql:/docker-entrypoint-initdb.d/001-seed.sql:ro
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d payment"]
      interval: 5s
      timeout: 3s
      retries: 30
  bank:
    build: ./infra/fake-bank
    cpus: 0.5
    mem_limit: 256m
    environment:
      BANK_JOURNAL: /data/bank.sqlite3
    volumes:
      - bankdata:/data
    ports:
      - "127.0.0.1:${BANK_PORT:-18081}:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build:
      context: ./${ARM:-1}/${CORE:-core1}
    cpus: 1.5
    mem_limit: 1536m
    environment:
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx768m -XX:ActiveProcessorCount=2
      DB_URL: jdbc:postgresql://db:5432/payment
      DB_USER: lab
      DB_PASSWORD: lab-local-only
      BANK_BASE_URL: http://bank:8081
    depends_on:
      db:
        condition: service_healthy
      bank:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fsS http://localhost:8080/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
  k6:
    image: grafana/k6:1.2.3
    profiles: [test]
    cpus: 2
    mem_limit: 1024m
    environment:
      BASE_URL: http://app:8080
    volumes:
      - ./evaluation/k6:/tests:ro
    depends_on:
      app:
        condition: service_healthy
volumes:
  pgdata:
  bankdata:
